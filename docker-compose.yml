services:

  # ── Backend: FastAPI + SQLite ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    ports:
      - "8000:8000"          # host:container — browser calls http://localhost:8000
    volumes:
      - todo-db:/app/data    # named volume keeps todos.db across restarts
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/todos.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend: Nginx serving static files ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    ports:
      - "3000:80"            # host:container — open http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  todo-db:
    driver: local
