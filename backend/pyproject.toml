[project]
name = "todo-backend"
version = "0.1.0"
description = "Todo microservice — FastAPI + SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "httpx>=0.27.0",   # for TestClient in tests
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
